name: wheels

# Build binary wheels for Linux (manylinux), macOS and Windows with
# cibuildwheel. Because zpds bundles a prebuilt Zig library and uses cffi's
# dlopen bindings (no CPython ABI), each platform yields a single
# py3-none-<platform> wheel — see [tool.cibuildwheel] in pyproject.toml.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - "pyproject.toml"
      - "setup.py"
      - "MANIFEST.in"
      - "build.zig"
      - "build.zig.zon"
      - "zig/**"
      - "python/zpds/**"
      - ".github/workflows/wheels.yml"

jobs:
  build_wheels:
    name: wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.21
        # All configuration (Zig install, single-interpreter build, import
        # test) lives in [tool.cibuildwheel] in pyproject.toml.

      - uses: actions/upload-artifact@v6
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pipx run build --sdist
      - uses: actions/upload-artifact@v6
        with:
          name: sdist
          path: ./dist/*.tar.gz

  publish:
    name: publish to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write # required for PyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
